version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: geodecouvretout-db
    environment:
      POSTGRES_USER: geoadmin
      POSTGRES_PASSWORD: geopassword
      POSTGRES_DB: geodecouvretout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoadmin -d geodecouvretout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
